sonar.projectKey=jamalgoogle_devsecops-pipeline-github-actions
sonar.projectName=devsecops-pipeline-github-actions
sonar.sourceEncoding=UTF-8

sonar.sources=app/src
sonar.tests=app/test
sonar.exclusions=**/node_modules/**

# Fail the pipeline when the quality gate fails (security rating, new vulnerabilities, hotspots)
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
